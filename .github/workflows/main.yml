name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Fix Build Tools 31.0.0
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "build-tools;31.0.0" || true
          if [ -d "$ANDROID_HOME/build-tools/31.0.0" ]; then
            cd "$ANDROID_HOME/build-tools/31.0.0"
            ln -sf d8 dx
            ln -sf lib/d8.jar lib/dx.jar
          fi

      - name: Permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-APK
          path: "**/build/outputs/apk/**/*.apk"
          
