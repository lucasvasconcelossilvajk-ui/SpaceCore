name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Fix Build Tools 31.0.0
        run: |
          SDK_DIR="/usr/local/lib/android/sdk/build-tools/31.0.0"
          sudo ln -sf "$SDK_DIR/d8" "$SDK_DIR/dx"
          sudo ln -sf "$SDK_DIR/lib/d8.jar" "$SDK_DIR/lib/dx.jar"

      - name: Permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-APK
          path: "**/build/outputs/apk/**/*.apk"
          
